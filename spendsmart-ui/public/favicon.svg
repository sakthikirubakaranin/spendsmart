<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <!-- Subtle top-left shine -->
  <rect width="40" height="40" rx="10" fill="url(#shine)"/>

  <!-- Rupee symbol — drawn as paths -->
  <!-- Top horizontal bar -->
  <line x1="12" y1="11" x2="28" y2="11" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Second bar -->
  <line x1="12" y1="17" x2="25" y2="17" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Vertical stem -->
  <line x1="14" y1="11" x2="14" y2="30" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Bowl of the R -->
  <path d="M14 11 Q28 11 28 14 Q28 17 14 17" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- Diagonal slash down-right (₹ characteristic) -->
  <line x1="14" y1="17" x2="27" y2="30" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
</svg>
