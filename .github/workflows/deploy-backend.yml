name: Deploy Backend → GCP Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'spendsmart-api/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1          # Mumbai — closest to India
  SERVICE: spendsmart-api
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/spendsmart-api

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        working-directory: spendsmart-api
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push to Google Container Registry
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60 \
            --set-env-vars "APP_ENV=production" \
            --set-env-vars "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --set-secrets "DATABASE_URL=spendsmart-database-url:latest" \
            --set-secrets "REDIS_URL=spendsmart-redis-url:latest" \
            --set-secrets "JWT_SECRET=spendsmart-jwt-secret:latest" \
            --set-secrets "MAIL_USERNAME=spendsmart-mail-username:latest" \
            --set-secrets "MAIL_PASSWORD=spendsmart-mail-password:latest"

      - name: Show service URL
        run: |
          gcloud run services describe $SERVICE \
            --region $REGION \
            --format 'value(status.url)'
